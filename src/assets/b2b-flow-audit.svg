<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" style="background-color: #dbe4db; font-family: serif;">
  <!-- Title -->
  <text x="600" y="80" text-anchor="middle" font-size="40" font-style="italic" fill="#000">
    User Flow Audit: Identifying the friction points.
  </text>

  <!-- Flowchart Group -->
  <g transform="translate(50, 150)" font-family="sans-serif" font-size="12">
    <!-- Styles -->
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#666" />
      </marker>
    </defs>
    
    <!-- Nodes -->
    
    <!-- Start -->
    <g transform="translate(0, 150)">
      <ellipse cx="50" cy="25" rx="40" ry="20" fill="#fff" stroke="#666" stroke-width="2"/>
      <text x="50" y="30" text-anchor="middle">Start</text>
    </g>
    
    <!-- Arrow to Login -->
    <line x1="90" y1="175" x2="130" y2="175" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Login -->
    <g transform="translate(130, 150)">
      <rect x="0" y="0" width="150" height="50" rx="5" fill="#fff" stroke="#666" stroke-width="2"/>
      <text x="75" y="30" text-anchor="middle">Login/Access Account</text>
    </g>

    <!-- Arrow to Decision -->
    <line x1="280" y1="175" x2="290" y2="175" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Decision -->
    <g transform="translate(290, 135)">
      <polygon points="60,0 120,40 60,80 0,40" fill="#fff" stroke="#666" stroke-width="2"/>
      <text x="60" y="35" text-anchor="middle">How to find</text>
      <text x="60" y="50" text-anchor="middle">the card?</text>
    </g>

    <!-- TOP PATH (Search) -->
    <!-- Path line -->
    <path d="M350,135 L350,80 L400,80" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Search Node (Gray) -->
    <g transform="translate(400, 55)">
      <rect x="0" y="0" width="100" height="50" rx="5" fill="#d3d3d3" stroke="#666" stroke-width="2"/>
      <text x="50" y="30" text-anchor="middle">Use search bar</text>
    </g>

    <!-- Arrow to No Results -->
    <line x1="500" y1="80" x2="540" y2="80" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- No Results (Gray) -->
    <g transform="translate(540, 55)">
      <ellipse cx="50" cy="25" rx="40" ry="20" fill="#d3d3d3" stroke="#666" stroke-width="2"/>
      <text x="50" y="30" text-anchor="middle">No Results</text>
    </g>


    <!-- MIDDLE PATH (Scroll) -->
    <!-- Path line -->
    <line x1="410" y1="175" x2="450" y2="175" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Scroll Node -->
    <g transform="translate(450, 150)">
      <rect x="0" y="0" width="100" height="50" rx="5" fill="#fff" stroke="#666" stroke-width="2"/>
      <text x="50" y="30" text-anchor="middle">Scroll down</text>
    </g>

    <!-- Arrow to Shop -->
    <line x1="550" y1="175" x2="590" y2="175" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Shop Node -->
    <g transform="translate(590, 150)">
      <rect x="0" y="0" width="120" height="50" rx="5" fill="#fff" stroke="#666" stroke-width="2"/>
      <text x="60" y="30" text-anchor="middle">Tap "Shop in store"</text>
    </g>

    <!-- Arrow to Scan -->
    <line x1="710" y1="175" x2="750" y2="175" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Scan Node -->
    <g transform="translate(750, 150)">
      <rect x="0" y="0" width="100" height="50" rx="5" fill="#fff" stroke="#666" stroke-width="2"/>
      <text x="50" y="30" text-anchor="middle">Scan barcode</text>
    </g>

    <!-- Arrow to End -->
    <line x1="850" y1="175" x2="870" y2="175" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- End Node -->
    <g transform="translate(890, 140)">
      <ellipse cx="50" cy="35" rx="70" ry="35" fill="#fff" stroke="#666" stroke-width="2"/>
      <text x="50" y="30" text-anchor="middle">Purchase completion</text>
      <text x="50" y="45" text-anchor="middle">(End)</text>
    </g>


    <!-- BOTTOM PATH (Icon) -->
    <!-- Path line -->
    <path d="M350,215 L350,270 L400,270" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Icon Node -->
    <g transform="translate(400, 245)">
      <rect x="0" y="0" width="120" height="50" rx="5" fill="#fff" stroke="#666" stroke-width="2"/>
      <text x="60" y="25" text-anchor="middle">Tap icon next to the</text>
      <text x="60" y="40" text-anchor="middle">account name</text>
    </g>

    <!-- Arrow to Scan -->
    <line x1="520" y1="270" x2="560" y2="270" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Scan Node -->
    <g transform="translate(560, 245)">
      <rect x="0" y="0" width="100" height="50" rx="5" fill="#fff" stroke="#666" stroke-width="2"/>
      <text x="50" y="30" text-anchor="middle">Scan barcode</text>
    </g>

    <!-- Arrow to End -->
    <line x1="660" y1="270" x2="680" y2="270" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- End Node -->
    <g transform="translate(700, 235)">
      <ellipse cx="50" cy="35" rx="70" ry="35" fill="#fff" stroke="#666" stroke-width="2"/>
      <text x="50" y="30" text-anchor="middle">Purchase</text>
      <text x="50" y="45" text-anchor="middle">completion</text>
      <text x="50" y="60" text-anchor="middle">(End)</text>
    </g>

  </g>

  <!-- Footer Text -->
  <text x="600" y="600" text-anchor="middle" font-size="28" font-style="italic" fill="#000">
    <tspan x="600" dy="0">The 'Search' function (Top) was broken,</tspan>
    <tspan x="600" dy="40">and the primary flow (Middle) required excessive scrolling.</tspan>
    <tspan x="600" dy="40">The goal was to shift users to the direct path (Bottom)</tspan>
  </text>
</svg>
